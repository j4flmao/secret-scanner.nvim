# secret-scanner.nvim — bundled extended rules
#
# Layered on top of gitleaks' embedded defaults via `[extend] useDefault = true`
# (see `:h secret-scanner-merging`). Only rules that cover common secret shapes
# missing from the defaults are added here. Regexes are deliberately tight and
# keyword-scoped (with per-rule allowlists) to keep false positives low.
#
# Disable with:  require("secret-scanner").setup({ bundled_rules = false })

title = "secret-scanner extended rules"

[extend]
useDefault = true

[[rules]]
id = "github-pat"
description = "Detected a GitHub personal/installation/action token, risking unauthorized access to repositories and CI/CD pipelines."
regex = '''\b(ghp|gho|ghs|ghu|ghr|ghp)_[A-Za-z0-9]{36,}\b'''
keywords = ["ghp_", "gho_", "ghs_", "ghu_", "ghr_", "ghp_"]

[[rules]]
id = "github-fine-grained-pat"
description = "Detected a GitHub fine-grained personal access token."
regex = '''\bgithub_pat_[A-Za-z0-9_]{80,}\b'''
keywords = ["github_pat_"]

[[rules]]
id = "jwt"
description = "Detected a JSON Web Token (JWT) — bearer credentials for APIs and authentication systems."
regex = '''\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'''
keywords = ["eyj"]

[[rules]]
id = "jwt-secret-assignment"
description = "Detected a JWT signing secret assigned in a config or env file (.env, application.yml, docker-compose, ...)."
regex = '''(?i)\bjwt[_-]?secret\b[ \t\r\n]{0,20}=\s*["']?[0-9a-fA-F]{20,}(?:-?[0-9a-fA-F]{4,}){0,6}["']?'''
keywords = ["jwt_secret", "jwt-secret", "jwtsecret", "jwt_secret_key"]

[[rules]]
id = "private-key"
description = "Detected an embedded private key (OpenSSH, RSA, EC, DSA, PGP, PKCS) block."
regex = '''-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'''
keywords = ["-----begin"]

[[rules]]
id = "slack-token"
description = "Detected a Slack workspace token (xoxb/xoxp/xoxa/xoxr/xoxt)."
regex = '''\bxox[abprt]-[A-Za-z0-9-]{10,}\b'''
keywords = ["xoxb-", "xoxp-", "xoxa-", "xoxr-", "xoxt-"]

[[rules]]
id = "gitlab-pat"
description = "Detected a GitLab personal access token."
regex = '''\bglpat-[A-Za-z0-9_-]{20,}\b'''
keywords = ["glpat-"]

[[rules]]
id = "telegram-bot-token"
description = "Detected a Telegram bot token."
regex = '''\b\d{8,10}:AA[A-Za-z0-9_\-]{33,}\b'''
keywords = [":aa"]

[[rules]]
id = "sendgrid-api-key"
description = "Detected a SendGrid API key."
regex = '''\bSG\.[A-Za-z0-9_\-]{16,}\.[A-Za-z0-9_\-]{16,}\b'''
keywords = ["sg."]

[[rules]]
id = "uri-basic-auth-credentials"
description = "Detected embedded credentials (user:password@) inside a URI — covers postgres, mysql, mariadb, mongodb, mongodb+srv, redis, amqp(s), http(s), sqlserver and other connection strings."
regex = '''[a-zA-Z][a-zA-Z0-9+.-]{1,31}://(?:[^@\s/?:]{0,64}:)?[^@\s/?:]{2,}@[\w.:-]+'''
keywords = ["://"]
[[rules.allowlists]]
description = "Local development hosts are almost always test credentials."
regexes = [
    '''://[^@\s]*@[\w.-]*(?:localhost|127\.0\.0\.1|0\.0\.0\.0)(?::\d+)?''',
    '''://[^@\s]*:[^@\s]*@(?:[^/]+)/?(?:test|qa|dev|staging)''',
]
[[rules.allowlists]]
description = "Environment-variable templates (${DB_USER}:${DB_PASSWORD}) are not live credentials."
regexes = ['''[a-zA-Z][a-zA-Z0-9+.-]{1,31}://[^@\s]*\$\{[^@\s]+@''']

[[rules]]
id = "jdbc-url-credentials"
description = "Detected embedded credentials inside a JDBC URL (jdbc:postgresql://, jdbc:mysql://, ...)."
regex = '''\bjdbc:[a-zA-Z0-9]+://(?:[^@\s/?:]{0,64}:)?[^@\s/?:]{2,}@[\w.:-]+'''
keywords = ["jdbc:"]
[[rules.allowlists]]
description = "Local development hosts and env templates."
regexes = [
    '''jdbc:[a-zA-Z0-9]+://[^@\s]*@[\w.-]*(?:localhost|127\.0\.0\.1)(?::\d+)?''',
    '''jdbc:[a-zA-Z0-9]+://[^@\s]*\$\{[^@\s]+@''',
]

[[rules]]
id = "dotnet-adonet-connection-string"
description = "Detected an ADO.NET-style connection string (SQL Server, Npgsql, MySQL Connector) embedding a password."
regex = '''(?i)\b(?:server|data\s+source|data\s*source|host)\s*=\s*[^;]{1,64}\s*;.{0,160}?password\s*=\s*[^;\s"']+'''
keywords = ["password", "server", "host"]
[[rules.allowlists]]
description = "Placeholder or empty passwords."
regexes = [
    '''(?i)password\s*=\s*["']?(?:password|changeme|changeit|secret|placeholder|your\w*|\w*x{4,})["']?[^;\n]*''',
    '''(?i)password\s*=\s*["']{2}''',
]

[[rules]]
id = "json-secret-key-value"
description = "Detected a secret-like key holding a value in a JSON/TOML/YAML-style config (appsettings.json, user-secrets, launchSettings.json)."
entropy = 3.3
secretGroup = 1
regex = '''(?i)"?\b(?:client[_-]?secret|api[_-]?key|access[_-]?key|secret[_-]?key|token|password|pwd|private[_-]?key|signing[_-]?key|encryption[_-]?key|auth[_-]?token)\b"?\s*:\s*"?([^"\s,;\]]{8,})"?'''
keywords = ["client_secret", "apikey", "api_key", "access_key", "password", "token", "secret", "private_key"]
[[rules.allowlists]]
description = "Placeholder / development values and empty templates, anchored to the value start."
regexes = [
    '''^["']?(?:password|changeme|changeit|secret|localhost|example|placeholder|replace|remove|put|to-be-\w+|your\w*|\w*x{4,}\w*)[^"\s,;}]*["']?$''',
    '''^\$\{[^"'}\n]*\}$''',
    '''^["'][^"']{0,6}["']$''',
    '''^[^"\s,;}0-9A-Z]{0,7}$''',
    '''^from[_-][\w-]+$''',
    '''^\{\{[^}]*\}\}$''',
]

[[rules]]
id = "jwt-key-json"
description = "Detected a JWT signing key inside an appsettings-style JSON block (\"./Jwt\": { \"Key\": \"...\" })."
regex = '''(?i)"jwt"\s*:\s*\{[^{}]{0,240}?"key"\s*:\s*"[^"]{10,}"'''
keywords = ["jwt", "key"]
[[rules.allowlists]]
regexes = [
    '''(?i)"key"\s*:\s*"(?:your|replace|change|sample|demo|example|\$)''',
    '''(?i)"key"\s*:\s*"[0-9a-f]{8}"''',
]

[[rules]]
id = "xml-key-value-secret"
description = "Detected a secret value in an XML key/value entry (.config, web.config, app.config)."
regex = '''(?i)<\s*\w+[^>]*?key\s*=\s*["'][A-Za-z0-9_.-]*(?:password|secret|token|apikey|signing|credential|jwt)[A-Za-z0-9_.-]*["'][^>]*?value\s*=\s*["'][^"']{6,}["']'''
keywords = ["password", "secret", "token", "apikey"]
[[rules.allowlists]]
description = "Placeholder values like web.config Boilerplate."
regexes = [
    '''(?i)value\s*=\s*["'](?:password|changeme|changeit|secret|your|replace|example|\$)''',
]

[[rules]]
id = "xml-element-secret"
description = "Detected a secret inside an XML element (web.xml, credentials.xml, bean/config XML, JSP deployment descriptors): <password>...</password> etc."
regex = '''(?i)<\s*[a-zA-Z0-9_:\-]*(?:password|passwd|secret|pwd|apikey|api[_-]?key|token|credential)[a-zA-Z0-9_:\-]*\s*>([^<]{4,})<\s*/\s*[a-zA-Z0-9_:\-]*(?:password|passwd|secret|pwd|apikey|api[_-]?key|token|credential)[a-zA-Z0-9_:\-]*\s*>'''
secretGroup = 1
entropy = 3.3
keywords = ["password", "passwd", "secret", "pwd", "token", "apikey", "api_key", "credential"]
[[rules.allowlists]]
description = "Placeholder values, env-var references and obvious boilerplate."
regexes = [
    '''^(?:\$\{[^\}]*\}|\{\{[^\}]*\}|&[a-zA-Z]+;)$''',
    '''^["']?(?:changeme|changeit|secret|password|passwd|dummy|placeholder|example|test\w*|sample|your\w*|xxxx+|\w*x{3,})["']?$''',
    '''^.{0,3}$''',
]

[[rules]]
id = "xml-name-value-credential"
description = "Detected a credential in an XML name=... value=... attribute pair (Tomcat context.xml, Ant, service definitions)."
regex = '''(?i)\bname\s*=\s*["'][^"']{0,48}(?:password|passwd|secret|apikey|token|credential)[^"']{0,16}["'][^>]{0,120}?value\s*=\s*["']([^"']{4,})["']'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "secret", "apikey", "api_key", "token", "credential"]
[[rules.allowlists]]
description = "Placeholder values and env-var references."
regexes = [
    '''^(?:\$\{[^\}]*\}|\{\{[^\}]*\}|&[a-zA-Z]+;)$''',
    '''^['"]?(?:changeme|changeit|secret|password|passwd|dummy|placeholder|example|test\w*|sample|your\w*|xxxx+)['"]?$''',
    '''^.{0,3}$''',
]

[[rules]]
id = "xml-init-param-secret"
description = "Detected a secret param-value under a sensitive param-name in servlet web.xml / context.xml deployment descriptors."
regex = '''(?i)<\s*param-name\s*>\s*[^<]*(?:password|passwd|secret|token|credential|apikey)[^<]*\s*<\s*/param-name\s*>[^<]{0,120}?<\s*param-value\s*>([^<]{4,})<'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "secret", "token", "credential", "apikey"]
[[rules.allowlists]]
regexes = [
    '''^(?:\$\{[^\}]*\}|\{\{[^\}]*\}|&[a-zA-Z]+;)$''',
    '''^["']?(?:changeme|changeit|secret|password|passwd|dummy|placeholder|example|test\w*|sample|your\w*|xxxx+)["']?$''',
]

[[rules]]
id = "yaml-colon-secret"
description = "Detected a secret-like key in a colon/equals config (YAML/TOML/.properties/inline pipeline variables) — application.yml, values.yaml, compose env, workflows."
regex = '''(?im)^\s*(?:-\s+)?["']?[a-zA-Z0-9_./\-]*(?:password|passwd|secret|token|apikey|api[_-]?key|access[_-]?key|credential|private[_-]?key|client[_-]?secret|auth[_-]?token)["']?\s*[:=]\s*["']?([^"'\s#][^"'#\s\n]{5,})["']?$'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "secret", "token", "apikey", "api_key", "access_key", "credential", "private_key", "client_secret", "auth_token"]
[[rules.allowlists]]
description = "Placeholder values, env/masked/encrypted references."
regexes = [
    '''^(?:\$\{[^\}]*\}|\{\{[^\}]*\}|\*{3,})$''',
    '''^from[_-][\w-]+$''',
    '''^(?:changeme|changeit|secret|password|passwd|example|localhost|test\w*|sample|dummy|your\w*|\w*x{3,}|true|false|null|nil|none|0+|-1)$''',
    '''^["']?[\w./-]+@[\w.-]+(?::[\w.]+)?["']?$''',
]

[[rules]]
id = "java-inline-credentials"
description = "Detected a hardcoded credential in Java/JSP source (String password = \"...\")."
regex = '''(?i)\b(?:String|var)\s+\w*?(?:password|passwd|secret|apikey|token|credential)\w*?\s*=\s*"([^"\\]{4,})"'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "secret", "apikey", "token", "credential"]
[[rules.allowlists]]
regexes = [
    '''^(?:\$\{[^\}]*\}|&[a-zA-Z]+;)$''',
    '''^["']?(?:changeme|changeit|secret|password|passwd|example|placeholder|test\w*|sample|your\w*|xxxx+)["']?$''',
]

[[rules]]
id = "vault-token"
description = "Detected a HashiCorp Vault token (hvs./hvb./hvr.) that can decrypt arbitrary Vault secrets."
regex = '''\b(?:hvs|hvb|hvr)\.[A-Za-z0-9_-]+\b'''
keywords = ["hvs.", "hvb.", "hvr."]

[[rules]]
id = "netrc-password"
description = "Detected a `machine ... password` entry in a netrc/_netrc credentials file."
regex = '''(?i)\bmachine\s+[\w.-]+\s+login\s+\S+\s+password\s+([^\s]+)'''
secretGroup = 1
keywords = ["machine"]
[[rules.allowlists]]
regexes = [
    '''^["']?(?:password|changeme|changeit|example|your\w*|xxxx+)["']?$''',
    '''^from-''',
]

[[rules]]
id = "kubernetes-secret-stringdata"
description = "Detected a Kubernetes Secret stringData block embedding plaintext secret values."
regex = '''(?i)stringData\s*:\s*\n((?:[ \t]+\S+:\s*\S[^\n]*\n?)+)'''
secretGroup = 1
keywords = ["stringdata", "string_data"]
[[rules.allowlists]]
description = "Blocks that only reference other manifests, env vars or masked values."
regexes = [
    '''(?i)[ \t]+\S+:\s*["']?(?:\$\{|from:|\*{3,})''',
    '''(?i)[ \t]+\S+:\s*["']?(?:your\w*|changeme|example)[^"'#\n]*["']?$''',
]

[[rules]]
id = "env-assignment-secret"
description = "Detected a short secret assigned to a secret-like KEY=value (dotenv, .properties, .npmrc, CI env definitions)."
regex = '''(?im)^\s*[A-Za-z0-9_.\-]*(?:password|passwd|secret|token|apikey|api[_-]?key|access[_-]?key|credential|private[_-]?key|client[_-]?secret)[A-Za-z0-9_.\-]*\s*=\s*["']?([^"'#\s\n]{6,})["']?\s*(?:#.*)?$'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "secret", "token", "apikey", "api_key", "access_key", "credential", "private_key", "client_secret"]
[[rules.allowlists]]
regexes = [
    '''^(?:\$\{[^\}]*\}|\{\{[^\}]*\}|\*{3,})$''',
    '''^from[_-][\w-]+$''',
    '''^(?:changeme|changeit|secret|password|passwd|example|localhost|test\w*|sample|dummy|your\w*|\w*x{3,}|true|false|null|nil|none|0+|-1)$''',
    '''^["']?[\w./-]+@[\w.-]+(?::[\w.]+)?["']?$''',
]

[[rules]]
id = "generic-secret-assignment"
description = "Detected a high-entropy value assigned to a secret-like key (PASSWORD/SECRET/TOKEN/API KEY) — a catch-all for unknown or private key formats."
entropy = 3.5
regex = '''(?i)\b(?:password|passwd|secret|token|api[_-]?key|access[_-]?key|auth[_-]?token|private[_-]?key)\b[ \t\r\n]{0,20}=\s*["']?[0-9a-zA-Z/+=_-]{16,}["']?'''
keywords = ["password", "passwd", "secret", "token", "api_key", "apikey", "access_key", "private_key", "auth_token"]
[[rules.allowlists]]
description = "Placeholders and non-secret values commonly assigned to such keys."
regexes = [
    '''(?i)^[ \t]*["']?(?:localhost|example|changeme|changeit|default|dummy|placeholder|xxxxx+|your_?[\w]+|your[\w]*)["']?$''',
    '''(?i)["'][\w.-]*(?:localhost|example\.(?:com|org|net))[\w.-]*["']''',
    '''^[ \t]*["']?(?:0+|1|true|false|null|nil|none|undefined|yes|no)"?$''',
    '''^[ \t]*[#;].*$''',
]

[[rules]]
id = "aws-secret-access-key"
description = "Detected an AWS Secret Access Key assigned alongside an access key identifier."
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key\b[ \t\r\n]{0,20}=\s*["']?[A-Za-z0-9/+=]{40}["']?'''
keywords = ["aws_secret_access_key", "aws-secret-access-key"]
[[rules.allowlists]]
regexes = ['''.+EXAMPLEKEY$''']