name: Feature request
description: Suggest an idea for secret-scanner.nvim
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        We're a small project — the quickest path to your feature is often
        a small PR. See `CONTRIBUTING.md` for what we'd love from you (hint:
        stack example configs).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The scenario, not the solution. Who is affected, and how often?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What behavior would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds, other plugins, or ways around it today.
      placeholder: "e.g. I currently run `gitleaks detect` manually"
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Would you contribute this yourself?
      options:
        - "Yes"
        - "Yes, but I'd need guidance"
        - "No"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, references, or sketches that help us understand.
    validations:
      required: false